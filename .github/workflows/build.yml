name: Workers proxy
on:
  push:
    branches: [steam-speed-worker]
  pull_request:
    branches: [steam-speed-worker]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run types
      - run: npm run build
